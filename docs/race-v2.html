<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opération Phoenix — Course en direct</title>
<style>
  :root {
    --bg-0: #0a0e17;
    --card: #151b2c;
    --card-2: #1a2236;
    --card-border: #232b42;
    --text: #e8ecf6;
    --text-dim: #8892b0;
    --accent: #ff6b4a;
    --accent-2: #4ad0ff;
    --gold: #ffd166;
    --good: #35d07f;
    --bad: #ff5c6c;
    --warn: #ffb84d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 20% -10%, #1a2140 0%, var(--bg-0) 45%), var(--bg-0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      radial-gradient(600px circle at 80% 10%, rgba(74,208,255,0.08), transparent 60%),
      radial-gradient(500px circle at 10% 90%, rgba(255,107,74,0.08), transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 14px 24px 12px; height: 100vh; display: flex; flex-direction: column; }
  header, .track-panel { flex: none; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- HEADER ---------- */
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  h1 {
    font-size: clamp(24px, 3.2vw, 34px); margin: 0; font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--text-dim); margin-top: 2px; font-size: 13px; }
  .subtitle a { color: var(--accent-2); text-decoration: none; }
  .subtitle a:hover { text-decoration: underline; }
  .head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim);
    background: var(--card); border: 1px solid var(--card-border); padding: 7px 13px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .pill b { color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 2s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(53,208,127,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(53,208,127,0); }
    100% { box-shadow: 0 0 0 0 rgba(53,208,127,0); }
  }
  .section-title { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin: 0 0 12px; }

  /* ---------- COMPACT RACE ---------- */
  .track-panel { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: clamp(8px, 1.4vh, 14px) 20px; margin-top: clamp(8px, 1.4vh, 16px); }
  .lanes { display: flex; flex-direction: column; gap: clamp(4px, 0.9vh, 9px); }
  .lane { display: flex; align-items: center; gap: 12px; }
  .lane-label { width: 200px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .lane-label .n { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane-label .p { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lane.leader .lane-label .n { color: var(--gold); }
  .track {
    flex: 1; position: relative; height: clamp(20px, 3.1vh, 28px); border-radius: 8px; overflow: visible;
    border: 1px solid var(--card-border);
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 48px), linear-gradient(180deg, #10141f, #0c0f18);
  }
  .lane.leader .track { border-color: rgba(255,209,102,0.5); box-shadow: 0 0 18px -6px rgba(255,209,102,0.55); }
  .track-fill {
    position: absolute; top: 0; left: 0; bottom: 0; border-radius: 8px 0 0 8px; opacity: 0.18; width: 0%;
    background: linear-gradient(90deg, var(--lane-color-a), var(--lane-color-b));
    transition: width 1.2s cubic-bezier(.22,1,.36,1);
  }
  .finish-flag { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: 0.5; }
  .runner { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%); transition: left 1.2s cubic-bezier(.22,1,.36,1); z-index: 2; }
  .runner-badge {
    width: clamp(18px, 2.6vh, 24px); height: clamp(18px, 2.6vh, 24px); border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 11px; color: #0a0e17; background: var(--lane-color-a);
    box-shadow: 0 2px 8px -2px rgba(0,0,0,0.6), 0 0 0 2px rgba(10,14,23,0.9);
  }
  .runner-badge.has-members { cursor: help; }
  .lane.leader .runner-badge { box-shadow: 0 0 0 2px rgba(10,14,23,0.9), 0 0 14px 2px var(--lane-color-a); }
  .runner-crown { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 12px; z-index: 4; }
  .float-gain { position: absolute; font-weight: 800; font-size: 12px; color: var(--good); pointer-events: none; white-space: nowrap; animation: float-up 1.4s ease forwards; z-index: 3; }
  @keyframes float-up { 0% { opacity: 0; transform: translate(-50%, -4px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -34px); } }

  /* ---------- FEED (hero) ---------- */
  .feed-section { margin-top: clamp(8px, 1.4vh, 16px); flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .toolbar { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 10px 14px; flex: none; }
  .toolbar-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); width: 64px; flex-shrink: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; user-select: none;
    color: var(--text-dim); background: transparent; border: 1px solid var(--card-border); font-family: inherit; transition: all .15s ease;
  }
  .chip:hover { color: var(--text); border-color: #36405e; }
  .chip.on { color: var(--text); background: rgba(255,255,255,0.07); border-color: var(--chip-color, var(--accent-2)); }
  .chip .team-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color, var(--accent-2)); }
  .chip .count { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .search { flex: 1; min-width: 180px; max-width: 360px; background: var(--card-2); border: 1px solid var(--card-border); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13px; outline: none; font-family: inherit; }
  .search:focus { border-color: var(--accent-2); }
  .toolbar-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); }
  .link-btn { background: none; border: none; color: var(--accent-2); cursor: pointer; font-size: 12px; font-family: inherit; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  .scroll-area { flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--card-border) transparent; }
  .scroll-area::-webkit-scrollbar { width: 8px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 999px; }
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--text-dim); font-family: inherit; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); background: rgba(255,255,255,0.07); border-color: var(--card-border); }
  .toolbar-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .feed { display: flex; flex-direction: column; gap: 12px; }
  .empty { color: var(--text-dim); font-size: 14px; padding: 28px; text-align: center; background: var(--card); border: 1px dashed var(--card-border); border-radius: 14px; }

  .commit {
    background: var(--card); border: 1px solid var(--card-border); border-left: 4px solid var(--team-color, var(--accent-2));
    border-radius: 14px; padding: 14px 18px;
  }
  .commit.ci-failure { border-left-color: var(--bad); background: linear-gradient(90deg, rgba(255,92,108,0.07), var(--card) 40%); }
  .commit.fresh { animation: fresh 2.4s ease; }
  @keyframes fresh { 0% { box-shadow: 0 0 0 2px var(--accent-2), 0 0 24px rgba(74,208,255,0.35); } 100% { box-shadow: none; } }
  .commit-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .team-tag { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; }
  .team-tag .team-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--team-color); }
  .commit-msg { font-size: 14px; color: var(--text); flex: 1; min-width: 200px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sha { font-size: 12px; color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 2px 7px; border-radius: 6px; }
  .when { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .ci { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .ci.success { color: var(--good); background: rgba(53,208,127,0.13); }
  .ci.failure { color: var(--bad); background: rgba(255,92,108,0.15); }
  .ci.pending { color: var(--warn); background: rgba(255,184,77,0.13); }
  .ci.none, .ci.unknown { color: var(--text-dim); background: rgba(255,255,255,0.05); }
  .ci-note { margin-top: 8px; font-size: 12.5px; color: var(--bad); }

  .changes { display: flex; flex-direction: column; margin-top: 10px; }
  .change { display: grid; grid-template-columns: 24px minmax(180px, 1.1fr) auto 64px minmax(0, 1.6fr); gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--card-border); font-size: 13px; }
  .change:first-child { border-top: none; }
  .change .ico { text-align: center; }
  .change .task b { font-family: ui-monospace, monospace; font-size: 12.5px; margin-right: 6px; }
  .change .task span { color: var(--text-dim); }
  .verdict { font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .verdict .arrow { color: var(--text-dim); font-weight: 400; margin: 0 4px; }
  .v-PASS { color: var(--good); } .v-PARTIEL { color: var(--warn); } .v-FAIL { color: var(--bad); }
  .pts { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .change.to-PASS .pts { color: var(--good); } .change.to-PARTIEL .pts { color: var(--warn); } .change.to-FAIL .pts { color: var(--bad); }
  .reason { color: var(--text-dim); font-size: 12.5px; line-height: 1.4; }
  .cap-tag { font-size: 10.5px; color: var(--bad); border: 1px solid rgba(255,92,108,0.4); border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
  .no-change { color: var(--text-dim); font-size: 12.5px; margin-top: 8px; }
  .more { align-self: center; margin-top: 4px; padding: 9px 20px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); cursor: pointer; font-family: inherit; }
  .more:hover { border-color: var(--accent-2); }

  /* ---------- MATRIX (secondary, collapsed) ---------- */
    .matrix-scroll { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 6px 14px 10px; }
  .matrix-empty { color: var(--text-dim); font-size: 13px; padding: 8px 4px; }
  table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; }
  table.matrix thead th { position: sticky; top: 0; z-index: 2; background: var(--card); padding: 8px 6px; text-align: center; font-weight: 700; color: var(--text-dim); border-bottom: 1px solid var(--card-border); white-space: nowrap; }
  table.matrix thead th.corner { left: 0; z-index: 3; text-align: left; }
  table.matrix th .team-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  table.matrix tbody th { position: sticky; left: 0; z-index: 1; background: var(--card); text-align: left; padding: 6px 10px 6px 4px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; font-family: ui-monospace, monospace; }
  table.matrix td { text-align: center; padding: 4px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .cell { width: 30px; height: 22px; margin: 0 auto; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: #0a0e17; border: 1px solid var(--card-border); background: rgba(255,255,255,0.02); }
  .cell.done { border-color: transparent; }

  
  @media (max-width: 860px), (max-height: 560px) {
    html, body { height: auto; overflow: auto; }
    .wrap { height: auto; display: block; }
    .feed-section { display: block; }
    .scroll-area { overflow: visible; }
  }
  @media (max-width: 860px) {
    .lane-label { width: 120px; }
    .change { grid-template-columns: 22px 1fr auto 52px; }
    .change .reason { grid-column: 2 / -1; }
    .toolbar-label { width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Opération Phoenix</h1>
        <div class="subtitle">Hackathon IA Mind7 · Course en direct — <a href="index.html">version podium</a> · <a href="race.html">ancienne vue</a></div>
      </div>
      <div class="head-right">
        <div class="pill">MAJ <b id="updated-at">—</b></div>
        <div class="pill"><b id="pass-count">—</b> réussites</div>
        <div class="pill"><b id="max-points">—</b> pts max</div>
        <div class="pill"><span class="dot"></span><span id="status-text">connecté</span></div>
      </div>
    </header>

    <div class="track-panel"><div class="lanes" id="lanes"></div></div>

    <section class="feed-section">
      <div class="toolbar">
        <div class="toolbar-top">
          <div class="tabs">
            <button type="button" class="tab on" data-view="feed">🔥 Flux d'activité</button>
            <button type="button" class="tab" data-view="matrix">🧩 Matrice par tâche</button>
          </div>
          <div class="toolbar-foot"><span id="result-count"></span>&nbsp;·&nbsp;<button class="link-btn" id="reset" type="button">Réinitialiser les filtres</button></div>
        </div>
        <div class="toolbar-row"><span class="toolbar-label">Équipes</span><div class="toolbar-row" id="team-chips"></div></div>
        <div class="toolbar-row" id="status-row">
          <span class="toolbar-label">Statut</span>
          <div class="toolbar-row" id="status-chips"></div>
          <input class="search" id="search" type="search" placeholder="Rechercher : tâche, commit, raison…" autocomplete="off">
        </div>
      </div>
      <div class="scroll-area" id="feed-area"><div class="feed" id="feed"></div></div>
      <div class="scroll-area" id="matrix-area" hidden><div class="matrix-scroll"><div id="matrix"></div></div></div>
    </section>
  </div>

<script>
  const REFRESH_MS = 15000;
  const PAGE_SIZE = 40;
  const PALETTE = [
    ['#ff6b4a', '#ff9a6b'], ['#4ad0ff', '#7fe3ff'], ['#c792ea', '#e0b3ff'], ['#35d07f', '#7ce8ab'],
    ['#ffd166', '#ffe19a'], ['#ff5c6c', '#ff8f99'], ['#7aa2ff', '#a5bfff'], ['#f78fb3', '#fbb3cc'],
  ];
  const RANK = { FAIL: 0, PARTIEL: 1, PASS: 2 };
  const STATUS_FILTERS = [
    ['all', 'Tout'], ['pass', '✅ Validées'], ['partial', '🟡 Partielles'], ['ci', '🔴 CI rouge'], ['regress', '↘ Régressions'],
  ];
  const CI_LABEL = { success: 'CI verte', failure: 'CI rouge', pending: 'CI en cours', none: 'pas de CI', unknown: 'CI inconnue' };

  let data = null;
  let teamColor = {};          // team_id -> [a, b]
  let seen = new Set();        // feed entry keys already displayed (to highlight new ones)
  let firstLoad = true;
  let shown = PAGE_SIZE;
  const filters = { teams: new Set(), status: 'all', q: '', view: 'feed' };
  let prevPoints = {};

  const $ = id => document.getElementById(id);
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
    catch (e) { return iso; }
  }
  function relTime(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return "à l'instant";
    if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
    if (s < 86400) return `il y a ${Math.floor(s / 3600)} h ${String(Math.round((s % 3600) / 60)).padStart(2, '0')}`;
    return new Date(iso).toLocaleDateString('fr-FR');
  }

  // ---------- filters <-> URL hash ----------
  function readHash() {
    try {
      const p = new URLSearchParams(location.hash.slice(1));
      filters.teams = new Set((p.get('teams') || '').split(',').filter(Boolean).map(Number));
      filters.status = STATUS_FILTERS.some(f => f[0] === p.get('status')) ? p.get('status') : 'all';
      filters.q = p.get('q') || '';
      filters.view = p.get('view') === 'matrix' ? 'matrix' : 'feed';
    } catch (e) { /* ignore malformed hash */ }
  }
  function writeHash() {
    const p = new URLSearchParams();
    if (filters.teams.size) p.set('teams', [...filters.teams].join(','));
    if (filters.status !== 'all') p.set('status', filters.status);
    if (filters.q) p.set('q', filters.q);
    if (filters.view !== 'feed') p.set('view', filters.view);
    const h = p.toString();
    try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* file:// etc. */ }
  }

  // ---------- feed model ----------
  // New score.json: data.feed = one entry per judged commit. Older score.json (no feed):
  // rebuild an approximate feed from data.events so the page still works.
  function buildFeed(d) {
    if (Array.isArray(d.feed) && d.feed.length) return d.feed;
    const groups = new Map();
    for (const ev of (d.events || [])) {
      const m = /^\[([0-9a-f]{7})\]\s*/.exec(ev.reason || '');
      const key = ev.team_id + '|' + (m ? m[1] : ev.task_code);
      if (!groups.has(key)) groups.set(key, { ts: ev.ts, team_id: ev.team_id, team_name: ev.team_name, sha: m ? m[1] : '', msg: '', ci_state: 'unknown', legacy: true, changes: [] });
      const g = groups.get(key);
      g.changes.push({ task_code: ev.task_code, title: ev.task_title, from: null, to: ev.result, points: ev.points, reason: (ev.reason || '').replace(/^\[[0-9a-f]{7}\]\s*/, '') });
      if (ev.ts > g.ts) g.ts = ev.ts;
    }
    return [...groups.values()].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  }

  function isRegression(c) { return c.from && RANK[c.to] < RANK[c.from]; }
  function statusMatch(c) {
    switch (filters.status) {
      case 'pass': return c.to === 'PASS';
      case 'partial': return c.to === 'PARTIEL';
      case 'regress': return isRegression(c);
      default: return true;
    }
  }
  function visibleEntries(feed) {
    const q = filters.q.trim().toLowerCase();
    const out = [];
    for (const e of feed) {
      if (filters.teams.size && !filters.teams.has(e.team_id)) continue;
      if (filters.status === 'ci' && e.ci_state !== 'failure') continue;
      const entryHit = q && [e.msg, e.sha, e.team_name].some(x => (x || '').toLowerCase().includes(q));
      let rows = e.changes.filter(statusMatch);
      if (q && !entryHit) rows = rows.filter(c => [c.task_code, c.title, c.reason].some(x => (x || '').toLowerCase().includes(q)));
      const needsRows = ['pass', 'partial', 'regress'].includes(filters.status) || (q && !entryHit);
      if (needsRows && !rows.length) continue;
      if (filters.status === 'ci') rows = e.changes;
      out.push({ e, rows });
    }
    return out;
  }

  // ---------- render ----------
  function renderChips(feed) {
    const counts = {};
    feed.forEach(e => { counts[e.team_id] = (counts[e.team_id] || 0) + 1; });
    $('team-chips').innerHTML = data.teams.map(t => {
      const on = filters.teams.has(t.id) ? ' on' : '';
      return `<button type="button" class="chip${on}" data-team="${t.id}" style="--chip-color:${teamColor[t.id][0]}"><span class="team-dot"></span>${escapeHtml(t.name)}<span class="count">${counts[t.id] || 0}</span></button>`;
    }).join('');
    $('status-chips').innerHTML = STATUS_FILTERS.map(([k, label]) =>
      `<button type="button" class="chip${filters.status === k ? ' on' : ''}" data-status="${k}">${label}</button>`).join('');
  }

  function renderChange(c) {
    const ico = c.to === 'PASS' ? '✅' : c.to === 'PARTIEL' ? '🟡' : '❌';
    const arrow = c.from ? `<span class="v-${c.from}">${c.from}</span><span class="arrow">→</span>` : '';
    const sign = c.points > 0 ? '+' : '';
    const reg = (c.regression || isRegression(c)) ? '<span class="cap-tag" title="Ce commit a dégradé une tâche déjà validée">↘ régression</span>' : '';
    const cap = c.capped ? '<span class="cap-tag" title="Tâche faite mais plafonnée à 50 % : la CI de ce commit est rouge">plafonné — CI rouge</span>' : '';
    const reason = c.reason ? escapeHtml(c.reason) : (c.to === 'PASS' ? 'Tous les critères sont remplis.' : '');
    return `<div class="change to-${c.to}">
      <div class="ico">${ico}</div>
      <div class="task"><b>${escapeHtml(c.task_code)}</b><span>${escapeHtml(c.title)}</span></div>
      <div class="verdict">${arrow}<span class="v-${c.to}">${c.to}</span>${reg}${cap}</div>
      <div class="pts">${sign}${c.points} pt${Math.abs(c.points) > 1 ? 's' : ''}</div>
      <div class="reason">${reason}</div>
    </div>`;
  }

  function renderEntry(e, rows, fresh) {
    const color = teamColor[e.team_id] ? teamColor[e.team_id][0] : '#4ad0ff';
    const ciPill = e.legacy ? '' : `<span class="ci ${e.ci_state}">${CI_LABEL[e.ci_state] || e.ci_state}</span>`;
    const sha = e.sha ? `<span class="sha mono">${escapeHtml(e.sha)}</span>` : '';
    const msg = e.msg || (e.legacy ? 'Tâche validée' : 'Commit');
    const note = e.ci_state === 'failure'
      ? `<div class="ci-note">⚠ ${escapeHtml(e.ci_detail || 'CI rouge')} — les tâches de ce commit sont plafonnées à PARTIEL tant que la CI n'est pas verte.</div>` : '';
    const body = rows.length ? `<div class="changes">${rows.map(renderChange).join('')}</div>`
      : `<div class="no-change">Aucun changement de verdict sur ce commit.</div>`;
    return `<article class="commit${e.ci_state === 'failure' ? ' ci-failure' : ''}${fresh ? ' fresh' : ''}" style="--team-color:${color}">
      <div class="commit-head">
        <span class="team-tag"><span class="team-dot"></span>${escapeHtml(e.team_name)}</span>
        <span class="commit-msg">${escapeHtml(msg)}</span>
        ${sha}
        <span class="when" title="${escapeHtml(e.ts)}">${fmtTime(e.ts)} · ${relTime(e.ts)}</span>
        ${ciPill}
      </div>
      ${note}${body}
    </article>`;
  }

  function renderFeed(feed) {
    const list = visibleEntries(feed);
    const slice = list.slice(0, shown);
    $('result-count').textContent = `${list.length} commit${list.length > 1 ? 's' : ''} affiché${list.length > 1 ? 's' : ''} sur ${feed.length}`;
    if (!list.length) {
      $('feed').innerHTML = `<div class="empty">${feed.length ? 'Aucun résultat avec ces filtres.' : 'Aucune action pour le moment.'}</div>`;
    } else {
      const more = list.length > shown ? `<button class="more" id="more" type="button">Afficher plus (${list.length - shown})</button>` : '';
      $('feed').innerHTML = slice.map(({ e, rows }) => {
        const key = e.team_id + '|' + e.sha + '|' + e.ts;
        const fresh = !firstLoad && !seen.has(key);
        return renderEntry(e, rows, fresh);
      }).join('') + more;
    }
    feed.forEach(e => seen.add(e.team_id + '|' + e.sha + '|' + e.ts));
  }

  function renderLanes(teams, maxPoints) {
    const lanesEl = $('lanes');
    const leaderPoints = Math.max(...teams.map(t => t.points));
    if (lanesEl.children.length === 0) {
      lanesEl.innerHTML = teams.map(team => {
        const color = teamColor[team.id];
        const members = Array.isArray(team.members) ? team.members.filter(Boolean) : [];
        const titleAttr = members.length ? ` title="${escapeHtml(members.join(', '))}"` : '';
        return `<div class="lane" id="lane-${team.id}" style="--lane-color-a:${color[0]};--lane-color-b:${color[1]}">
          <div class="lane-label"><span class="n">${escapeHtml(team.name)}</span><span class="p"><span id="pts-${team.id}">${team.points}</span> / ${maxPoints}</span></div>
          <div class="track"><div class="track-fill" id="fill-${team.id}"></div><div class="finish-flag">🏁</div>
            <div class="runner" id="runner-${team.id}"><div class="runner-badge${members.length ? ' has-members' : ''}"${titleAttr}>${escapeHtml(team.name).slice(-1)}</div></div>
          </div></div>`;
      }).join('');
    }
    teams.forEach(team => {
      const pct = Math.max(2, Math.min(96, (team.points / maxPoints) * 100));
      const laneEl = $(`lane-${team.id}`), runnerEl = $(`runner-${team.id}`);
      if (!laneEl) return;
      laneEl.classList.toggle('leader', team.points === leaderPoints && leaderPoints > 0);
      runnerEl.style.left = pct + '%';
      $(`fill-${team.id}`).style.width = pct + '%';
      $(`pts-${team.id}`).textContent = team.points;
      const prev = prevPoints[team.id];
      if (prev !== undefined && team.points > prev) {
        const gain = document.createElement('div');
        gain.className = 'float-gain'; gain.style.left = pct + '%'; gain.style.top = '0px';
        gain.textContent = '+' + (team.points - prev);
        laneEl.querySelector('.track').appendChild(gain);
        setTimeout(() => gain.remove(), 1500);
      }
      prevPoints[team.id] = team.points;
    });
    document.querySelectorAll('.runner-crown').forEach(el => el.remove());
    teams.forEach(team => {
      if (team.points === leaderPoints && leaderPoints > 0) {
        const crown = document.createElement('div');
        crown.className = 'runner-crown'; crown.textContent = '👑';
        $(`runner-${team.id}`).appendChild(crown);
      }
    });
  }

  // Matrix built only from completed (PASS) events: no task list is hard-coded, so nothing
  // is revealed about tasks no team has completed yet.
  function renderMatrix(events, teams) {
    const el = $('matrix');
    const cols = filters.teams.size ? teams.filter(t => filters.teams.has(t.id)) : teams;
    const passes = (events || []).filter(e => e.result === 'PASS');
    if (!passes.length) { el.innerHTML = '<div class="matrix-empty">Aucune tâche complétée pour le moment.</div>'; return; }
    const byTask = new Map();
    for (const ev of passes) {
      if (!byTask.has(ev.task_code)) byTask.set(ev.task_code, { title: ev.task_title, byTeam: new Map() });
      const entry = byTask.get(ev.task_code), ex = entry.byTeam.get(ev.team_id);
      if (!ex || new Date(ev.ts) > new Date(ex.ts)) entry.byTeam.set(ev.team_id, { points: ev.points, ts: ev.ts });
    }
    const codes = [...byTask.keys()].sort((a, b) => a.localeCompare(b));
    const head = `<thead><tr><th class="corner">Tâche</th>${cols.map(t =>
      `<th><span class="team-dot" style="background:${teamColor[t.id][0]}"></span>${escapeHtml(t.name)}</th>`).join('')}</tr></thead>`;
    const body = `<tbody>${codes.map(code => {
      const entry = byTask.get(code);
      const cells = cols.map(t => {
        const hit = entry.byTeam.get(t.id);
        if (!hit) return `<td><div class="cell"></div></td>`;
        return `<td><div class="cell done" style="background:${teamColor[t.id][0]}" title="${escapeHtml(t.name)} — ${escapeHtml(entry.title)} (${fmtTime(hit.ts)})">${hit.points}</div></td>`;
      }).join('');
      return `<tr><th title="${escapeHtml(entry.title)}">${escapeHtml(code)}</th>${cells}</tr>`;
    }).join('')}</tbody>`;
    el.innerHTML = `<table class="matrix">${head}${body}</table>`;
  }

  function render() {
    if (!data) return;
    const feed = buildFeed(data);
    $('updated-at').textContent = fmtTime(data.updated_at);
    $('max-points').textContent = data.max_points;
    $('pass-count').textContent = (data.events || []).filter(e => e.result === 'PASS').length;
    renderLanes(data.teams, data.max_points);
    renderChips(feed);
    renderFeed(feed);
    renderMatrix(data.events, data.teams);
    applyView();
    firstLoad = false;
  }

  function applyView() {
    const isFeed = filters.view === 'feed';
    $('feed-area').hidden = !isFeed;
    $('matrix-area').hidden = isFeed;
    $('status-row').style.display = isFeed ? '' : 'none';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === filters.view));
  }

  // ---------- events ----------
  function onFilterChange() { shown = PAGE_SIZE; writeHash(); render(); }
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-team]');
    if (t) {
      const id = Number(t.dataset.team);
      filters.teams.has(id) ? filters.teams.delete(id) : filters.teams.add(id);
      return onFilterChange();
    }
    const v = ev.target.closest('[data-view]');
    if (v) { filters.view = v.dataset.view; return onFilterChange(); }
    const s = ev.target.closest('[data-status]');
    if (s) { filters.status = s.dataset.status; return onFilterChange(); }
    if (ev.target.id === 'more') { shown += PAGE_SIZE; return render(); }
    if (ev.target.id === 'reset') { filters.teams.clear(); filters.status = 'all'; filters.q = ''; filters.view = 'feed'; $('search').value = ''; return onFilterChange(); }
  });
  $('search').addEventListener('input', ev => { filters.q = ev.target.value; onFilterChange(); });
  window.addEventListener('hashchange', () => { readHash(); $('search').value = filters.q; render(); });

  async function poll() {
    try {
      const res = await fetch('score.json?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
      data.teams.forEach((t, i) => { teamColor[t.id] = PALETTE[i % PALETTE.length]; });
      render();
      $('status-text').textContent = 'connecté';
    } catch (e) {
      $('status-text').textContent = 'erreur de chargement — nouvelle tentative...';
      console.error(e);
    }
  }

  readHash();
  $('search').value = filters.q;
  poll();
  setInterval(poll, REFRESH_MS);
  setInterval(() => { if (data) renderFeed(buildFeed(data)); }, 30000); // keep relative times fresh
</script>
</body>
</html>
