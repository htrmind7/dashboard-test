<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opération Phoenix — Live Dashboard</title>
<style>
  :root {
    --bg-0: #0a0e17;
    --card: #151b2c;
    --card-border: #232b42;
    --text: #e8ecf6;
    --text-dim: #8892b0;
    --accent: #ff6b4a;
    --accent-2: #4ad0ff;
    --gold: #ffd166;
    --silver: #c9d1e0;
    --bronze: #d98e5a;
    --good: #35d07f;
    --bad: #ff5c6c;
    --warn: #ffb84d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(circle at 20% -10%, #1a2140 0%, var(--bg-0) 45%), var(--bg-0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(600px circle at 80% 10%, rgba(74,208,255,0.08), transparent 60%),
      radial-gradient(500px circle at 10% 90%, rgba(255,107,74,0.08), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; }
  h1 {
    font-size: clamp(28px, 4vw, 44px);
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: var(--text-dim); margin-top: 4px; font-size: 14px; }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-dim);
    background: var(--card); border: 1px solid var(--card-border);
    padding: 8px 14px; border-radius: 999px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 0 0 rgba(53,208,127,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(53,208,127,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(53,208,127,0); }
    100% { box-shadow: 0 0 0 0 rgba(53,208,127,0); }
  }

  .meta-row { display: flex; gap: 24px; margin: 28px 0 8px; flex-wrap: wrap; }
  .meta-chip {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 14px 20px; flex: 1; min-width: 150px;
  }
  .meta-chip .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .meta-chip .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .meta-chip .value.good { color: var(--good); }
  .meta-chip .value.bad { color: var(--bad); }
  .meta-chip .value.warn { color: var(--warn); }

  /* ---------- PODIUM ---------- */
  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-dim); margin: 40px 0 16px; display: flex; align-items: center; gap: 8px;
  }
  .podium {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 18px; margin: 8px 0 12px; flex-wrap: wrap;
  }
  .podium-slot {
    display: flex; flex-direction: column; align-items: center;
    width: 220px;
    opacity: 0; transform: translateY(20px);
    animation: rise 0.6s ease forwards;
  }
  .podium-slot.p1 { order: 2; }
  .podium-slot.p2 { order: 1; }
  .podium-slot.p3 { order: 3; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .crown { font-size: 26px; margin-bottom: -6px; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,209,102,0.7)); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .podium-card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px 18px 8px 8px;
    padding: 18px 16px;
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .podium-slot.p1 .podium-card { border-color: rgba(255,209,102,0.55); box-shadow: 0 0 40px -10px rgba(255,209,102,0.45); }
  .podium-slot.p2 .podium-card { border-color: rgba(201,209,224,0.4); box-shadow: 0 0 28px -12px rgba(201,209,224,0.3); }
  .podium-slot.p3 .podium-card { border-color: rgba(217,142,90,0.4); box-shadow: 0 0 28px -12px rgba(217,142,90,0.3); }

  .p-medal { font-size: 30px; }
  .p-name { font-size: 17px; font-weight: 700; margin: 4px 0 2px; }
  .p-points { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .p-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .podium-riser {
    width: 82%;
    border-radius: 8px 8px 0 0;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 8px;
    font-size: 28px; font-weight: 800; color: rgba(255,255,255,0.15);
    background: linear-gradient(180deg, #1a2136, #10141f);
    border: 1px solid var(--card-border); border-bottom: none;
  }
  .p1 .podium-riser { height: 96px; background: linear-gradient(180deg, rgba(255,209,102,0.16), #10141f); }
  .p2 .podium-riser { height: 66px; background: linear-gradient(180deg, rgba(201,209,224,0.12), #10141f); }
  .p3 .podium-riser { height: 42px; background: linear-gradient(180deg, rgba(217,142,90,0.12), #10141f); }

  /* ---------- LOWER GRID ---------- */
  .lower-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; margin-top: 8px; }
  @media (max-width: 860px) { .lower-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 18px 20px;
  }

  .rest-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--card-border);
  }
  .rest-row:last-child { border-bottom: none; }
  .rest-rank { width: 26px; color: var(--text-dim); font-weight: 700; font-size: 13px; }
  .rest-name { flex: 1; min-width: 0; }
  .rest-name .n { font-weight: 600; font-size: 14px; }
  .rest-bar-track { height: 5px; border-radius: 999px; background: #0e1320; margin-top: 6px; overflow: hidden; }
  .rest-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); width: 0%; transition: width 1s ease; }
  .rest-points { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }

  /* ---------- ACTIVITY FEED ---------- */
  .feed { max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .feed::-webkit-scrollbar { width: 6px; }
  .feed::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 999px; }

  .feed-item {
    display: flex; gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--card-border);
    opacity: 0; transform: translateX(-8px);
    animation: slide-in 0.4s ease forwards;
  }
  .feed-item:last-child { border-bottom: none; }
  @keyframes slide-in { to { opacity: 1; transform: translateX(0); } }

  .feed-badge {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
    background: rgba(255,255,255,0.04);
  }
  .feed-item.PASS .feed-badge { background: rgba(53,208,127,0.14); }
  .feed-item.FAIL .feed-badge { background: rgba(255,92,108,0.14); }
  .feed-item.PARTIEL .feed-badge { background: rgba(255,184,77,0.14); }

  .feed-body { flex: 1; min-width: 0; }
  .feed-title { font-size: 13.5px; line-height: 1.4; }
  .feed-title b { font-weight: 700; }
  .feed-code { color: var(--text-dim); font-size: 12px; }
  .feed-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 11.5px; color: var(--text-dim); }
  .feed-points { font-weight: 700; font-variant-numeric: tabular-nums; }
  .feed-item.PASS .feed-points { color: var(--good); }
  .feed-item.FAIL .feed-points { color: var(--bad); }
  .feed-item.PARTIEL .feed-points { color: var(--warn); }
  .feed-reason {
    margin-top: 5px; font-size: 12px; color: var(--text-dim);
    background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px 9px;
    border-left: 2px solid var(--card-border);
  }
  .feed-item.FAIL .feed-reason { border-left-color: var(--bad); }
  .feed-item.PARTIEL .feed-reason { border-left-color: var(--warn); }

  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 48px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Opération Phoenix</h1>
        <div class="subtitle">Hackathon IA Mind7 · Classement en direct</div>
      </div>
      <div class="status"><span class="dot"></span><span id="status-text">connecté</span></div>
    </header>

    <div class="meta-row">
      <div class="meta-chip"><div class="label">Dernière MAJ</div><div class="value" id="updated-at">—</div></div>
      <div class="meta-chip"><div class="label">Score max</div><div class="value" id="max-points">—</div></div>
      <div class="meta-chip"><div class="label">Réussites</div><div class="value good" id="pass-count">—</div></div>
      <div class="meta-chip"><div class="label">Échecs</div><div class="value bad" id="fail-count">—</div></div>
    </div>

    <div class="section-title">🏆 Podium</div>
    <div class="podium" id="podium"></div>

    <div class="lower-grid">
      <div class="panel">
        <div class="section-title" style="margin-top:0">📋 Classement complet</div>
        <div id="rest-list"></div>
      </div>
      <div class="panel">
        <div class="section-title" style="margin-top:0">🔥 Dernières actions</div>
        <div class="feed" id="feed"></div>
      </div>
    </div>

    <footer>Données : <code>score.json</code> — généré par l'agent d'évaluation Mind7</footer>
  </div>

<script>
  const REFRESH_MS = 15000;
  const statusText = document.getElementById('status-text');
  let lastUpdatedAt = null;

  function fmtTime(iso) {
    try {
      return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) { return iso; }
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderPodium(ranked, maxPoints) {
    const podium = document.getElementById('podium');
    const [p1, p2, p3] = ranked;
    const slots = [
      { team: p2, cls: 'p2', medal: '🥈' },
      { team: p1, cls: 'p1', medal: '🥇' },
      { team: p3, cls: 'p3', medal: '🥉' },
    ];
    podium.innerHTML = slots.map(({ team, cls, medal }) => {
      if (!team) return '';
      const pct = Math.min(100, Math.round((team.points / maxPoints) * 100));
      return `
        <div class="podium-slot ${cls}">
          ${cls === 'p1' ? '<div class="crown">👑</div>' : ''}
          <div class="podium-card">
            <div class="p-medal">${medal}</div>
            <div class="p-name">${escapeHtml(team.name)}</div>
            <div class="p-points">${team.points}</div>
            <div class="p-sub">${team.tasks_done}/${team.tasks_total} tâches · ${pct}%</div>
          </div>
          <div class="podium-riser"></div>
        </div>
      `;
    }).join('');
  }

  function renderRest(ranked, maxPoints) {
    const list = document.getElementById('rest-list');
    const rest = ranked.slice(3);
    if (!rest.length) { list.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">Toutes les équipes sont sur le podium 🎉</div>'; return; }
    list.innerHTML = rest.map((team, i) => {
      const rank = i + 4;
      const pct = Math.min(100, Math.round((team.points / maxPoints) * 100));
      return `
        <div class="rest-row">
          <div class="rest-rank">#${rank}</div>
          <div class="rest-name">
            <div class="n">${escapeHtml(team.name)}</div>
            <div class="rest-bar-track"><div class="rest-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="rest-points">${team.points}</div>
        </div>
      `;
    }).join('');
  }

  function renderFeed(events) {
    const feed = document.getElementById('feed');
    const sorted = [...(events || [])].sort((a, b) => new Date(b.ts) - new Date(a.ts)).slice(0, 12);
    if (!sorted.length) { feed.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">Aucune action pour le moment.</div>'; return; }
    feed.innerHTML = sorted.map((ev, i) => {
      const icon = ev.result === 'PASS' ? '✅' : ev.result === 'FAIL' ? '❌' : '🟡';
      const sign = ev.points > 0 ? '+' : '';
      const reason = ev.reason ? `<div class="feed-reason">${escapeHtml(ev.reason)}</div>` : '';
      return `
        <div class="feed-item ${ev.result}" style="animation-delay:${i * 0.04}s">
          <div class="feed-badge">${icon}</div>
          <div class="feed-body">
            <div class="feed-title"><b>${escapeHtml(ev.team_name)}</b> — ${escapeHtml(ev.task_title)} <span class="feed-code">(${escapeHtml(ev.task_code)})</span></div>
            <div class="feed-meta"><span>${fmtTime(ev.ts)}</span><span class="feed-points">${sign}${ev.points} pts</span></div>
            ${reason}
          </div>
        </div>
      `;
    }).join('');
  }

  function render(data) {
    document.getElementById('updated-at').textContent = fmtTime(data.updated_at);
    document.getElementById('max-points').textContent = data.max_points + ' pts';

    const events = data.events || [];
    document.getElementById('pass-count').textContent = events.filter(e => e.result === 'PASS').length;
    document.getElementById('fail-count').textContent = events.filter(e => e.result === 'FAIL').length;

    const ranked = [...data.teams].sort((a, b) => b.points - a.points);
    renderPodium(ranked, data.max_points);
    renderRest(ranked, data.max_points);
    renderFeed(events);
  }

  async function poll() {
    try {
      const res = await fetch('score.json?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data);
      statusText.textContent = 'connecté';
      lastUpdatedAt = data.updated_at;
    } catch (e) {
      statusText.textContent = 'erreur de chargement — nouvelle tentative...';
      console.error(e);
    }
  }

  poll();
  setInterval(poll, REFRESH_MS);
</script>
</body>
</html>
